<style>

#np{position:fixed;right:12px;top:calc(60px + env(safe-area-inset-top,0px));width:min(320px,92vw);z-index:9;box-shadow:0 10px 30px #0004}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#10231f;color:#fff;padding:8px 16px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

const bub=m=>m.r=='u'?`<div class="b u">${m.h}</div>`:`<div class="b a">${m.h}${m.src===false?'':'<div class=src>📚 Based on campus information</div>'}${(m.fu||[]).length?`<div class=row style="margin-top:8px">${m.fu.map(f=>`<button class=chip data-ask="${esc(f)}">${esc(f)}</button>`).join('')}</div>`:''}</div>`;
function draw(typ){const e=$('#ms');if(!e)return;e.innerHTML=(msgs.length?msgs.map(bub).join(''):`<div class=empty>✨<br>Try one of these:<div class=row style="justify-content:center;margin-top:10px">${SUG.map(q=>`<button class=chip data-ask="${esc(q)}">${esc(q)}</button>`).join('')}</div></div>`)+(typ?'<div class="b a"><span class=dots><i></i><i></i><i></i></span> Campus Copilot is thinking…</div>':'');if(msgs.length)e.lastElementChild.scrollIntoView({block:'end'})}
function ask(q){q=String(q).trim().slice(0,300);if(!q)return;if(cur!='chat')go('chat',1);msgs.push({r:'u',h:esc(q)});draw(1);setTimeout(()=>{let m;try{m=reply(q)}catch(e){m={h:'⚠️ Something went wrong. Please try again.',fu:[],src:false}}msgs.push({r:'a',...m});draw()},900)}
const plan=k=>{const t=PT[k],n=k?CR[k][0]:'exam',d=k?[...t,'Solve practice questions from Resources','Attempt a timed previous exam paper','Revise weak topics and take a mock test']:['Database Management Systems','Operating Systems','Computer Networks','Machine Learning','Software Engineering','Previous exam papers','Revision and mock tests'];return`<b>7-day ${n} study plan</b>`+d.map((x,i)=>`<div>Day ${i+1}: ${x}</div>`).join('')};
const evList=a=>a.map(e=>`<div>• <b>${e.n}</b>: ${dstr(e.off)}, ${e.t}, ${e.loc}</div>`).join('');
function reply(q){const s=q.toLowerCase(),has=r=>r.test(s),sj=has(/\bos\b|operating/)?'O':has(/dbms|database/)?'D':has(/network|\bcn\b/)?'N':has(/\bml\b|machine/)?'M':has(/software|\bse\b/)?'S':'';
if(has(/next class|next lecture/)){const n=nxt();return{h:`Your next class is <b>${n.c.n}</b>, ${f12(n.c.s)}–${f12(n.c.e)} in <b>${n.c.r}</b> with ${n.c.f}. ${cd(n)}.`,fu:['Where is the CSE department?','What classes do I have today?']}}
if(has(/class(es)?.*today|today.*class|my schedule|timetable/)){const L=cls(DN[new Date().getDay()]);return{h:L.length?'<b>Today’s classes</b>'+L.map(c=>`<div>• ${f12(c.s)}–${f12(c.e)} ${c.n} (${c.r})</div>`).join(''):'You have no classes today.',fu:['Where is my next class?']}}
if(has(/faculty|professor|who teach|who is my|taught by/)){const l=sj?[CR[sj]]:Object.values(CR);return{h:l.map(c=>`<div><b>${c[0]}</b>: ${c[1]}</div>`).join(''),fu:['What resources do I have for Operating Systems?']}}
if(has(/study plan|prepare|preparation/))return{h:plan(sj),fu:['What resources do I have for Operating Systems?','Recommend an event for me']};
if(has(/recommend/)){const e=recs()[0];return{h:`I’d recommend <b>${e.n}</b> (${dstr(e.off)}, ${e.t}, ${e.loc}). It matches your interests: ${e.tags.filter(t=>ints.includes(t)).join(', ')||'campus life'}.`,fu:['What AI events are happening this week?']}}
if(has(/event|workshop|hackathon|happening/)){const w=has(/month/)?30:7,l=EV.filter(e=>e.off<=w&&(!has(/\bai\b/)||e.cat=='AI'||e.tags.includes('AI'))).sort((a,b)=>a.off-b.off);return{h:l.length?`<b>${l.length} event${l.length>1?'s':''} in the next ${w} days</b>`+evList(l):`I don’t see matching events in the next ${w} days.`,fu:['Recommend an event for me']}}
if(!has(/^where/)){const v=SV.find(v=>SR[v[0]].test(s));if(v)return{h:`<b>${v[1]}</b><br>${v[3]}<ol>${v[6].split(';').map(x=>`<li>${x}</li>`).join('')}</ol>📄 ${v[4]}<br>⏱ ${v[5]}<br>📍 ${v[7]} · ✉ ${v[8]}`,fu:['What are the library timings?']}}
if(has(/resource|notes|material|slides|practice/)){const m={O:'Operating Systems',D:'Database Systems',N:'Computer Networks',M:'Artificial Intelligence',S:'Computer Science'}[sj],l=RS.filter(r=>!m||r[1]==m);return{h:l.length?`<b>${l.length} resources${m?' for '+m:''}</b>`+l.map(r=>`<div>• ${r[0]} (${r[2]})</div>`).join(''):'I don’t have resources for that subject yet.',fu:['Create a 7-day DBMS study plan']}}
const sw='what the are for how where who can you does with and about'.split(' '),w=(s.replace(/timings?|opening|open|closes?/g,'hours').match(/[a-z]{3,}/g)||[]).filter(x=>!sw.includes(x)),sc=d=>w.reduce((a,x)=>a+(d.t.toLowerCase().includes(x)?3:0)+(d.x.toLowerCase().includes(x)?1:0),0),b=DOCS.map(d=>[sc(d),d]).sort((a,b)=>b[0]-a[0])[0];
if(b&&b[0]>=2)return{h:`<b>${b[1].t}</b><br>${b[1].x}`,fu:['What classes do I have today?','What events are happening this week?']};
return{h:'I don’t have that information in the campus data available to me. Please check with the relevant office, or ask about classes, events, facilities or services.',src:false,fu:SUG.slice(0,3)}}
P.tt=()=>{const td=DN[new Date().getDay()],d=tday||(TT[td]?td:'Mon'),n=nxt(),m=nowM(),row=(c,day)=>{const t=day==td,now=t&&c.sm<=m&&m<c.em,up=t&&n.i==0&&n.c.s==c.s;return`<div class="card cl ${now?'now':up?'up':''}"><div class=tm>${f12(c.s)}<br><small class=mut>${f12(c.e)}</small></div><div><b>${c.n}</b> ${now?'<span class=pill>Now</span>':up?'<span class=pill>Up next</span>':''}<br><span class=mut>📍 ${c.r} · 👤 ${c.f}</span></div></div>`};
return`<div class=row>${Object.keys(TT).map(x=>`<button class="chip ${tv=='day'&&x==d?'on':''}" data-a=day data-v=${x}>${x}</button>`).join('')}<button class="chip ${tv=='week'?'on':''}" data-a=view data-v=${tv=='day'?'week':'day'}>${tv=='day'?'Week view':'Day view'}</button></div>`+(tv=='day'?[d]:Object.keys(TT)).map(x=>(tv=='week'?`<h3>${x}</h3>`:'')+cls(x).map(c=>row(c,x)).join('')).join('')+'<p><button class=btn data-ask="What classes do I have today?">✨ Ask AI about my timetable</button></p>'};
P.map=()=>`<input placeholder="Search campus locations…" value="${esc(mq)}" oninput="mq=this.value;mapQ()"><div id=mp></div>`;
function mapQ(){const q=mq.trim().toLowerCase(),h=q&&F.find(f=>f[1].toLowerCase().includes(q));if(h)sx=h[0];mapDraw()}
function mapDraw(){const e=$('#mp');if(!e)return;const q=mq.trim().toLowerCase(),hl=q?F.filter(f=>f[1].toLowerCase().includes(q)).map(f=>f[0]):[],s=F.find(f=>f[0]==sx);
e.innerHTML=`<svg viewBox="0 0 600 380" style="width:100%;border-radius:14px;background:#10b9811f;border:1px solid var(--bd)"><path d="M300 345V50M130 215H470M130 125H470M100 315H500" stroke="var(--bd)" stroke-width=12 fill=none />${s&&s[0]!='gate'?`<path class=rt d="M300 345V${s[4]}H${s[3]}"/>`:''}${F.map(f=>`<g class="n ${hl.includes(f[0])?'hl':''} ${f[0]==sx?'sel':''}" data-a=sel data-v=${f[0]}><circle cx=${f[3]} cy=${f[4]} r=17 /><text x=${f[3]} y=${+f[4]+5}>${f[2]}</text><text class=lb x=${f[3]} y=${+f[4]+33}>${f[1]}</text></g>`).join('')}</svg>`+(s?`<div class=card style="margin-top:12px"><h3 style="margin:0">${s[2]} ${s[1]}</h3><p>${s[5]}</p><p class=mut>🕘 ${s[6]} · 🏢 ${s[7]}<br>Facilities: ${s[8]}</p><div class=row><button class=btn data-ask="Where is the ${s[1]}?">✨ Ask Campus AI</button>${s[0]!='gate'?'<span class=mut>Dashed route starts at the Main Gate</span>':''}</div></div>`:'<p class=empty>Tap a location to see details and a route from the Main Gate.</p>')}
P.ev=()=>`<h3 style="margin-top:0">Recommended for you</h3><div class=g>${recs().slice(0,3).map(evCard).join('')}</div><h3>All events</h3><div class=row><input style="flex:1;min-width:160px" placeholder="Search events…" value="${esc(dq)}" oninput="dq=this.value;evDraw()"><select style="width:auto" onchange="df=this.value;evDraw()"><option value=all>Any date<option value=7 ${df=='7'?'selected':''}>This week<option value=30 ${df=='30'?'selected':''}>This month</select></div><div class=row id=ec style="margin:8px 0"></div><div class=g id=el></div>`;
function evDraw(){if(!$('#el'))return;$('#ec').innerHTML=['All','AI','Coding','Workshop','Seminar','Sports','Cultural','Club','Career'].map(c=>`<button class="chip ${ec==c?'on':''}" data-a=cat data-v=${c}>${c}</button>`).join('');const q=dq.toLowerCase(),l=EV.filter(e=>(ec=='All'||e.cat==ec)&&(df=='all'||e.off<=+df)&&(e.n+e.desc+e.loc).toLowerCase().includes(q)).sort((a,b)=>a.off-b.off);$('#el').innerHTML=l.length?l.map(evCard).join(''):'<div class=empty style="grid-column:1/-1">No events match. Try another category or date range.</div>'}
P.res=()=>`<p><button class=btn data-ask="Create a 7-day study plan for my upcoming exams based on my courses.">✨ Create Study Plan</button></p><div class=row>${['All','Computer Science','Mathematics','Artificial Intelligence','Database Systems','Operating Systems','Computer Networks'].map(c=>`<button class="chip ${rc==c?'on':''}" data-a=rc data-v="${c}">${c}</button>`).join('')}</div><div class=g style="margin-top:12px">${RS.filter(r=>rc=='All'||r[1]==rc).map(r=>`<div class=card><span class=pill>${r[2]}</span><h3 style="margin:8px 0 2px">${r[0]}</h3><div class=mut>${r[1]}</div><p>${r[3]}</p><button class="btn ghost" data-a=link>${r[2]=='Video'?'Watch':'Download'}</button></div>`).join('')}</div>`;
P.svc=()=>`<div class=g>${SV.map(v=>`<details class=card><summary>${v[2]} ${v[1]}<div class=mut style="font-weight:400">${v[3]}</div></summary><p><b>Documents:</b> ${v[4]}<br><b>Processing time:</b> ${v[5]}<br><b>Office:</b> ${v[7]}<br><b>Contact:</b> ${v[8]}</p><b>Steps</b><ol>${v[6].split(';').map(x=>`<li>${x}</li>`).join('')}</ol><button class=btn data-ask="How do I apply for ${v[1]}?">✨ Ask Campus AI</button></details>`).join('')}</div>`;
P.me=()=>`<div class=card><div class=row><div style="font-size:42px">🧑‍🎓</div><div><h2 style="margin:0">${U.name}</h2><span class=mut>${U.email}</span></div></div><p><b>Department:</b> ${U.dept}<br><b>Year:</b> ${U.year} · <b>Semester:</b> ${U.sem}<br><b>Courses:</b> ${Object.values(CR).map(c=>c[0]).join(', ')}</p></div><h3>Interests</h3><p class=mut style="margin-top:0">Tap to update. Event recommendations change right away.</p><div class=row>${ALLI.map(i=>`<button class="chip ${ints.includes(i)?'on':''}" data-a=int data-v="${i}">${i}</button>`).join('')}</div><h3>Settings</h3><div class=row>Theme: ${['auto','light','dark'].map(t=>`<button class="chip ${st.get('th','auto')==t?'on':''}" data-a=theme data-v=${t}>${t}</button>`).join('')}</div><p class=mut>AI mode: Demo. Answers come from built-in sample campus data; no LLM key is configured.</p><button class="btn ghost" data-a=out>Sign out</button>`;
function go(p,now){cur=p;const t=++gt;$('#np').hidden=true;$('#ttl').textContent=NAV.find(n=>n[0]==p)[1];$$('.nv').forEach(b=>b.classList.toggle('on',b.dataset.go==p));const fin=()=>{try{$('#main').innerHTML=P[p]();if(p=='map')mapDraw();if(p=='chat')draw();if(p=='ev')evDraw()}catch(e){$('#main').innerHTML='<div class="card empty">Something went wrong loading this page.<br><br><button class=btn data-go='+p+'>Try again</button></div>'}};if(now)fin();else{$('#main').innerHTML=SK;scrollTo(0,0);setTimeout(()=>t==gt&&fin(),220)}}
const A={login(){if($('#em').value.trim().toLowerCase()==U.email&&$('#pw').value=='demo123')A.demo();else $('#er').textContent='Invalid email or password. Try the demo account.'},
demo(){$('#login').hidden=true;$('#app').hidden=false;$('#sn').innerHTML=$('#bnav').innerHTML=NAV.map(n=>`<button class=nv data-go=${n[0]}><span>${n[2]}</span>${n[1]}</button>`).join('');cnt();go('home')},
bell(){const p=$('#np');p.hidden=!p.hidden;p.innerHTML='<b>Notifications</b>'+notifs().map(n=>`<div class=nt>🔔 ${n}</div>`).join('')+'<p style="margin:10px 0 0"><button class="btn ghost" data-a=readall>Mark all read</button></p>'},
readall(){unread=0;cnt();$('#np').hidden=true},
out(){$('#app').hidden=true;$('#login').hidden=false;msgs=[]},
clear(){msgs=[];draw()},
send(){const i=$('#ci');ask(i.value);i.value=''},
reg(v){v=+v;rg.has(v)?rg.delete(v):rg.add(v);toast(rg.has(v)?'Registered ✓':'Registration cancelled');cur=='ev'?(P.ev,go('ev',1)):go(cur,1)},
int(v){ints=ints.includes(v)?ints.filter(x=>x!=v):[...ints,v];st.set('ints',ints);go('me',1)},
sel(v){sx=v;mapDraw()},
cat(v){ec=v;evDraw()},
rc(v){rc=v;go('res',1)},
day(v){tday=v;tv='day';go('tt',1)},
view(v){tv=v;go('tt',1)},
theme(v){if(v=='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=v;st.set('th',v);go('me',1)},
link(){toast('Demo mode: resource links are placeholders')}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a],[data-go],[data-ask]');if(!t)return;if(t.dataset.go)go(t.dataset.go);else if(t.dataset.ask!==undefined)ask(t.dataset.ask);else A[t.dataset.a]?.(t.dataset.v)});
setInterval(()=>{const e=$('#cd'),n=nxt();if(e&&n)e.textContent=cd(n)},30000);
</script></body></html>
